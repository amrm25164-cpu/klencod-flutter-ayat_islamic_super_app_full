name: ayat_islamic_super_app
description: "آيات | AYAT - التطبيق الإسلامي الفائق والمتكامل للقرآن الكريم والحديث والأذكار."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  dio: ^5.4.0
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.20
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  flutter_local_notifications: ^16.3.0
  geolocator: ^10.1.0
  sensors_plus: ^4.0.2
  hijri: ^3.0.0
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/
  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/KFGQPC_Uthmanic_Script_HAFS_Regular.otf
        - asset: assets/fonts/UthmanicHafs1_Ver13.otf.ttf
